[project]
name = "jev-compare"
version = "0.1.0"
description = "Compare decision models such as Jev with general-purpose LLMs on labelled classification tasks: accuracy, latency, cost and calibration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
